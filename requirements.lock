# Not imported by any of our code, but required for reproducibility: openpyxl
# serialises the agreement workbooks with lxml when it is importable and with
# xml.etree otherwise, and the two emit the same data with different whitespace
# and namespace placement. Without this pin, `make verify` reports every .xlsx
# as changed on a fresh install.
