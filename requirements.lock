# Pinned environment for `make reproduce` — the analysis layer only.
#
# These are the resolved versions the reported results were produced with,
# including transitive dependencies, so a fresh environment re-derives the
# committed CSVs, tables, and figures byte for byte. Python 3.11 (.python-version).
#
# The six pipeline modules keep their own requirements.txt and their own venv;
# they are not needed to reproduce the paper, only to regenerate the evidence
# from scratch. See each module's README.
#
#   python3 -m venv analysis/.venv
#   analysis/.venv/bin/pip install -r requirements.lock

